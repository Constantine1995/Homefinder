name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start PostgreSQL with PostGIS and pgvector
        run: docker compose up --detach --wait postgres

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, intl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest

    name: Frontend types and build

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check types and build
        run: npm run build

  agent:
    runs-on: ubuntu-latest

    name: Agent (Python)

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start PostgreSQL with PostGIS and pgvector
        run: docker compose up --detach --wait postgres
        working-directory: .

      # Laravel's migrations own the schema the service reads.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.3
          extensions: intl, pdo_pgsql
          coverage: none

      - name: Migrate the test database
        working-directory: .
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          DB_DATABASE=homefinder_testing php artisan migrate --force

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.13
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and check types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src tests

      - name: Execute tests
        run: uv run pytest

  simulator:
    runs-on: ubuntu-latest

    name: Buyer simulator report

    defaults:
      run:
        working-directory: agent

    # A dialog takes a 8B model minutes on a laptop, too long and too costly for every push: the simulator runs
    # locally with `--save` after notable changes of the agent, and CI shows its metrics in the job summary, with a
    # warning when the report was made by other agent code or misses the targets.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.12.13
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Show the simulator report
        run: uv run python -m homefinder.evals.simulator --check
